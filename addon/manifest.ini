name = NotasWorkflowNVDA
summary = "Notas Workflow NVDA - Notes in status lanes"
description = """Notes and tasks in status lanes (To do, In progress, Blocked, Done), notebooks and folders, tags, formatted content, automatic saving and search, all from the keyboard with spoken feedback and fast with tens of thousands of notes. Shortcuts: NVDA+Alt+N opens the window, NVDA+Alt+F creates a note and NVDA+Alt+B searches the notes. Notes stay on this computer and can be imported and exported."""
author = "Wellington Cruz <weliveiracruz@gmail.com>"
url = https://github.com/weliveiracruz/NotasWorkflowNVDA
version = 1.3.0
changelog = """Lanes start closed (Right Arrow opens one) and stay as you leave them. After changing the status or the location of a note in its window, closing the window puts the focus on the next note of the same lane."""
docFileName = readme.html
minimumNVDAVersion = 2024.1.0
lastTestedNVDAVersion = 2026.1.1
