name = NotasWorkflowNVDA
summary = "Notas Workflow NVDA - Notes in status lanes"
description = """Notas Workflow NVDA brings the Notas Workflow web app into NVDA: notes organized in status lanes (To do, In progress, Blocked, Done), notebooks and folders, tags, formatted content, automatic saving and search, all from the keyboard with spoken feedback. Shortcuts: NVDA+Alt+N opens the window, NVDA+Alt+F creates a note and NVDA+Alt+B searches the notes. Notes stay on this computer, in the same format as the web app, and can be imported and exported."""
author = "Wellington Cruz <weliveiracruz@gmail.com>"
url = https://github.com/weliveiracruz/NotasWorkflowNVDA
version = 1.1.0
changelog = """New name: Notas Workflow NVDA (internal name NotasWorkflowNVDA). At the first start, the notes and settings of NotasWorkflow 1.0.0 are copied to the new name (nothing of the old add-on is deleted); uninstall the old add-on afterwards so the shortcuts do not clash."""
docFileName = readme.html
minimumNVDAVersion = 2024.1.0
lastTestedNVDAVersion = 2026.1.1
