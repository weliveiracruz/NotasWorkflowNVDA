name = NotasWorkflowNVDA
summary = "Notas Workflow NVDA - Notes in status lanes"
description = """Notes and tasks in status lanes (To do, In progress, Blocked, Done), notebooks and folders, tags, formatted content, automatic saving and search, all from the keyboard with spoken feedback and fast with tens of thousands of notes. Shortcuts: NVDA+Alt+N opens the window, NVDA+Alt+F creates a note and NVDA+Alt+B searches the notes. Notes stay on this computer, can be imported and exported, and can be saved as Word, Markdown or HTML documents."""
author = "Wellington Cruz <weliveiracruz@gmail.com>"
url = https://github.com/weliveiracruz/NotasWorkflowNVDA
version = 1.6.0
changelog = """Ctrl+Shift+Up Arrow and Ctrl+Shift+Down Arrow move the selected note up or down inside its lane, past the note shown next to it. The selection follows the note and NVDA says its new position (for example "Position 2 of 5"). The order is the same in every filter, and the note's change date stays the same."""
docFileName = readme.html
minimumNVDAVersion = 2024.1.0
lastTestedNVDAVersion = 2026.1.1
