name = NotasWorkflowNVDA
summary = "Notas Workflow NVDA - Notes in status lanes"
description = """Notes and tasks in status lanes (To do, In progress, Blocked, Done), notebooks and folders, formatted content, automatic saving and search, all from the keyboard with spoken feedback and fast with tens of thousands of notes. Shortcuts: NVDA+Alt+N opens the window, NVDA+Alt+F creates a note and NVDA+Alt+B searches the notes. Notes stay on this computer, can be imported and exported, and can be saved as Word, Markdown or HTML documents."""
author = "Wellington Cruz <weliveiracruz@gmail.com>"
url = https://github.com/weliveiracruz/NotasWorkflowNVDA
version = 1.8.0
changelog = """New Create > Note from document…: a Word (.docx), PowerPoint (.pptx), text (.txt), HTML or e-mail (.eml) document becomes a new note, with its title and its text in the content (headings, lists, bold and italic kept; tables as lines). New Insert document… button (Alt+D) in the note window puts the text of a document at the cursor. Documents are read in the background. Creating a notebook now opens the New notebook window, which also asks the folder."""
docFileName = readme.html
minimumNVDAVersion = 2024.1.0
lastTestedNVDAVersion = 2026.1.1
