summary = "Notas Workflow NVDA - Folhas em raias de status"
description = """Folhas e tarefas em raias de status (A fazer, Em andamento, Bloqueada, Concluída), cadernos e pastas, tags, conteúdo com formatação, salvamento automático e busca, tudo pelo teclado, com respostas faladas e rápido com dezenas de milhares de folhas. Atalhos: NVDA+Alt+N abre a janela, NVDA+Alt+F cria uma folha e NVDA+Alt+B busca nas folhas. As folhas ficam neste computador, podem ser importadas e exportadas e podem ser salvas como documentos do Word, Markdown ou HTML."""
changelog = """Ctrl+Shift+Seta para cima e Ctrl+Shift+Seta para baixo sobem ou descem a folha selecionada dentro da raia, passando a folha mostrada ao lado dela. A seleção acompanha a folha e o NVDA diz a nova posição (por exemplo "Posição 2 de 5"). A ordem é a mesma em todos os filtros, e a data de alteração da folha não muda."""
