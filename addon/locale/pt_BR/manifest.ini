summary = "Notas Workflow NVDA - Folhas em raias de status"
description = """O Notas Workflow NVDA leva a aplicação web Notas Workflow para dentro do NVDA: folhas organizadas em raias de status (A fazer, Em andamento, Bloqueada, Concluída), cadernos e pastas, tags, conteúdo com formatação, salvamento automático e busca, tudo pelo teclado e com respostas faladas. Atalhos: NVDA+Alt+N abre a janela, NVDA+Alt+F cria uma folha e NVDA+Alt+B busca nas folhas. As folhas ficam neste computador, no mesmo formato da aplicação web, e podem ser importadas e exportadas."""
changelog = """Novo nome: Notas Workflow NVDA (nome interno NotasWorkflowNVDA). No primeiro início, as folhas e as configurações do NotasWorkflow 1.0.0 são copiadas para o novo nome (nada do complemento antigo é apagado); depois, desinstale o complemento antigo para os atalhos não se repetirem."""
