summary = "Notas Workflow NVDA - Folhas em raias de status"
description = """Folhas e tarefas em raias de status (A fazer, Em andamento, Bloqueada, Concluída), cadernos e pastas, conteúdo com formatação, salvamento automático e busca, tudo pelo teclado, com respostas faladas e rápido com dezenas de milhares de folhas. Atalhos: NVDA+Alt+N abre a janela, NVDA+Alt+F cria uma folha e NVDA+Alt+B busca nas folhas. As folhas ficam neste computador, podem ser importadas e exportadas e podem ser salvas como documentos do Word, Markdown ou HTML."""
changelog = """Pastas e cadernos mudam de ordem com as mesmas teclas das folhas: Ctrl+Shift+Seta para cima e Ctrl+Shift+Seta para baixo, no campo Mostrar e em Cadernos e pastas. A pasta muda de lugar entre as pastas; o caderno, entre os cadernos da mesma pasta (ou sem pasta). O NVDA diz a nova posição, por exemplo Posição 2 de 3, e a ordem é a mesma em todas as listas. O botão Manual de uso saiu da janela principal e foi para as configurações do complemento, e o manual foi reescrito com todas as funções, atalhos e as novidades da versão."""
